[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spendscope"
version = "0.1.0"
description = "Entenda seus extratos e faturas (OFX e CSV de qualquer banco): categorias automáticas, assinaturas esquecidas, aumentos de preço, parcelas a vencer e cobranças em dobro — com relatório HTML, tudo offline."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yago de Jesus Martins" }]
keywords = ["spendscope", "extrato", "finanças pessoais", "ofx", "extrato bancário", "fatura", "assinaturas", "orçamento", "personal finance", "brasil"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Natural Language :: Portuguese (Brazilian)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pandas>=1.5"]

[project.urls]
Homepage = "https://github.com/yagodejesus/spendscope"
Issues = "https://github.com/yagodejesus/spendscope/issues"

[project.scripts]
spendscope = "spendscope.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spendscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905", "E501"]
